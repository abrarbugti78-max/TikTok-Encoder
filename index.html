<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>TikTok Encoder</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0b0b0f;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
width:min(94%,520px);
margin:35px auto;
}

.card{
background:#15151c;
border:1px solid #292932;
border-radius:22px;
padding:22px;
}

h1{
text-align:center;
margin:0 0 8px;
}

.sub{
text-align:center;
color:#999;
margin-bottom:22px;
}

input,select,button{
width:100%;
border-radius:12px;
}

input{
padding:13px;
background:#20202a;
border:1px solid #333;
color:#fff;
}

label{
display:block;
margin:17px 0 7px;
color:#ccc;
}

select{
padding:13px;
background:#20202a;
border:1px solid #333;
color:#fff;
}

button{
margin-top:22px;
padding:15px;
border:0;
font-size:16px;
font-weight:700;
background:#fff;
color:#000;
}

button:disabled{
opacity:.45;
}

progress{
width:100%;
margin-top:18px;
display:none;
}

#status{
text-align:center;
margin-top:18px;
color:#aaa;
line-height:1.5;
}

.note{
margin-top:18px;
padding:13px;
background:#20202a;
border-radius:12px;
font-size:13px;
color:#aaa;
line-height:1.5;
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<h1>🎬 TikTok Encoder</h1>

<div class="sub">
Video encoding with audio preservation
</div>

<input
id="file"
type="file"
accept="video/*">

<label>Quality</label>

<select id="quality">
<option value="12000000">High / CRF-like</option>
<option value="9000000">Balanced</option>
<option value="6500000">Smaller File</option>
</select>

<label>Resolution</label>

<select id="resolution">
<option value="original">Original</option>
<option value="1080">1080p</option>
<option value="720">720p</option>
</select>

<label>Frame Rate</label>

<select id="fps">
<option value="original">Original</option>
<option value="60">60 FPS</option>
<option value="30">30 FPS</option>
</select>

<button id="start">
Encode Video
</button>

<progress id="progress" min="0" max="100" value="0"></progress>

<div id="status">
Select a video first.
</div>

<div class="note">
Your video is processed locally in the browser.
No upload server is used.
</div>

</div>
</div>

<script>

const fileInput=document.getElementById("file");
const start=document.getElementById("start");
const status=document.getElementById("status");
const progress=document.getElementById("progress");

function getMime(){

const list=[
"video/mp4;codecs=avc1.42E01E,mp4a.40.2",
"video/mp4",
"video/webm;codecs=vp9,opus",
"video/webm;codecs=vp8,opus",
"video/webm"
];

for(const type of list){

try{

if(MediaRecorder.isTypeSupported(type)){
return type;
}

}catch(e){}

}

return "";
}


function getSize(w,h,target){

if(target==="original"){
return {w,h};
}

const wanted=parseInt(target);

if(h<=wanted){
return {w,h};
}

const ratio=w/h;

let nh=wanted;
let nw=Math.round(nh*ratio);

if(nw%2) nw--;

return {
w:nw,
h:nh
};

}


function wait(ms){

return new Promise(resolve=>setTimeout(resolve,ms));

}


start.onclick=async()=>{

const file=fileInput.files[0];

if(!file){

status.textContent="❌ Please select a video.";
return;

}

if(!window.MediaRecorder){

status.textContent="❌ MediaRecorder is not supported.";
return;

}

start.disabled=true;
progress.style.display="block";
progress.value=0;

let video;
let audioContext;
let inputURL;

try{

status.textContent="Loading video...";

inputURL=URL.createObjectURL(file);

video=document.createElement("video");

video.src=inputURL;
video.preload="auto";
video.playsInline=true;
video.muted=false;

await new Promise((resolve,reject)=>{

video.onloadedmetadata=resolve;
video.onerror=reject;

});

const targetResolution=
document.getElementById("resolution").value;

const fpsValue=
document.getElementById("fps").value;

const bitrate=
parseInt(document.getElementById("quality").value);

const size=getSize(
video.videoWidth,
video.videoHeight,
targetResolution
);

video.currentTime=0;

await video.play();

audioContext=
new (window.AudioContext ||
window.webkitAudioContext)();

if(audioContext.state==="suspended"){
await audioContext.resume();
}


/*
Create a dedicated audio pipeline.
This is important because the previous version
could lose/cut audio.
*/

const audioSource=
audioContext.createMediaElementSource(video);

const audioDestination=
audioContext.createMediaStreamDestination();

audioSource.connect(audioDestination);


/*
Do NOT connect audio to speakers.
That prevents feedback and double playback.
*/

const audioTracks=
audioDestination.stream.getAudioTracks();

const canvas=
document.createElement("canvas");

canvas.width=size.w;
canvas.height=size.h;

const ctx=
canvas.getContext("2d",{
alpha:false,
desynchronized:true
});


const requestedFPS=
fpsValue==="original"
?30
:parseInt(fpsValue);


/*
Canvas video track
*/

const videoStream=
canvas.captureStream(requestedFPS);


/*
Create final combined stream
*/

const finalStream=
new MediaStream();

const videoTrack=
videoStream.getVideoTracks()[0];

if(videoTrack){
finalStream.addTrack(videoTrack);
}

if(audioTracks.length){

finalStream.addTrack(
audioTracks[0]
);

}else{

throw new Error(
"Audio track could not be created."
);

}


const mime=getMime();

if(!mime){

throw new Error(
"No compatible browser video encoder found."
);

}


const chunks=[];

const recorder=
new MediaRecorder(
finalStream,
{
mimeType:mime,
videoBitsPerSecond:bitrate,
audioBitsPerSecond:192000
}
);


recorder.ondataavailable=e=>{

if(e.data && e.data.size>0){
chunks.push(e.data);
}

};


let stopped=false;

const finished=
new Promise(resolve=>{

recorder.onstop=()=>{
stopped=true;
resolve();
};

});


recorder.start(1000);

status.textContent=
"🎬 Encoding video + audio...";


const duration=video.duration;


/*
Frame loop
*/

function render(){

if(video.ended){

if(!stopped &&
recorder.state!=="inactive"){

recorder.stop();

}

return;

}

ctx.drawImage(
video,
0,
0,
size.w,
size.h
);

if(duration && isFinite(duration)){

progress.value=
Math.min(
100,
(video.currentTime/duration)*100
);

}

requestAnimationFrame(render);

}

render();


/*
Safety monitor:
sometimes iOS pauses the media element.
*/

const monitor=setInterval(()=>{

if(
!video.ended &&
video.paused &&
recorder.state==="recording"
){

video.play().catch(()=>{});

}

},500);


await new Promise(resolve=>{

const check=setInterval(()=>{

if(video.ended){

clearInterval(check);
clearInterval(monitor);

resolve();

}

},100);

});


if(recorder.state!=="inactive"){
recorder.stop();
}

await finished;


/*
Small delay lets final audio packet flush.
*/

await wait(500);


video.pause();

try{
audioSource.disconnect();
}catch(e){}

try{
audioContext.disconnect?.();
}catch(e){}

await audioContext.close();


const outputBlob=
new Blob(
chunks,
{type:mime}
);


if(outputBlob.size<1000){

throw new Error(
"Output video is empty."
);

}


const url=
URL.createObjectURL(outputBlob);

const a=
document.createElement("a");

a.href=url;

let extension="webm";

if(mime.includes("mp4")){
extension="mp4";
}

a.download=
"TikTok-Encoded."+extension;

document.body.appendChild(a);

a.click();

a.remove();


progress.value=100;

status.innerHTML=
"✅ Encoding complete!<br>"+
"Video + audio exported successfully.";

setTimeout(()=>{

URL.revokeObjectURL(url);

},30000);


}catch(error){

console.error(error);

status.textContent=
"❌ Encoding failed: "+
(error.message || error);

}finally{

try{

if(video){
video.pause();
}

}catch(e){}

if(inputURL){
URL.revokeObjectURL(inputURL);
}

start.disabled=false;

}

};

</script>

</body>
</html>
