<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Video Optimizer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #0b0b0f;
  color: white;
}

.container {
  width: min(92%, 520px);
  margin: 40px auto;
}

.card {
  background: #15151c;
  border: 1px solid #292934;
  border-radius: 22px;
  padding: 24px;
  box-shadow: 0 15px 50px rgba(0,0,0,.35);
}

h1 {
  margin-top: 0;
  text-align: center;
}

.subtitle {
  text-align: center;
  color: #aaa;
  margin-bottom: 25px;
}

input[type=file] {
  width: 100%;
  padding: 14px;
  background: #20202a;
  color: white;
  border-radius: 12px;
  border: 1px solid #333;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  color: #ccc;
}

select,
input[type=range] {
  width: 100%;
}

select {
  padding: 12px;
  border-radius: 10px;
  background: #20202a;
  color: white;
  border: 1px solid #333;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  border: 0;
  border-radius: 13px;
  background: white;
  color: black;
  font-size: 16px;
  font-weight: 700;
}

button:disabled {
  opacity: .45;
}

#status {
  margin-top: 20px;
  text-align: center;
  color: #aaa;
  line-height: 1.5;
}

progress {
  width: 100%;
  margin-top: 15px;
  display: none;
}

.info {
  margin-top: 20px;
  padding: 13px;
  border-radius: 12px;
  background: #20202a;
  color: #aaa;
  font-size: 13px;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>🎬 TikTok Optimizer</h1>

<div class="subtitle">
Optimize your video before uploading to TikTok
</div>

<input id="video" type="file" accept="video/*">

<label>Quality</label>

<select id="quality">
  <option value="0.92">High Quality</option>
  <option value="0.85">Balanced</option>
  <option value="0.78">Smaller File</option>
</select>

<label>Resolution</label>

<select id="resolution">
  <option value="original">Original</option>
  <option value="1080">1080p</option>
  <option value="720">720p</option>
</select>

<label>Frame Rate</label>

<select id="fps">
  <option value="original">Original</option>
  <option value="60">60 FPS</option>
  <option value="30">30 FPS</option>
</select>

<button id="encode">Optimize Video</button>

<progress id="progress" value="0" max="100"></progress>

<div id="status">
Select a video to begin.
</div>

<div class="info">
This tool processes the video locally in your browser.
Your original video is not uploaded to a server.
</div>

</div>
</div>

<script>
const videoInput = document.getElementById("video");
const encodeButton = document.getElementById("encode");
const statusBox = document.getElementById("status");
const progress = document.getElementById("progress");

function getVideoInfo(file) {
  return new Promise((resolve, reject) => {

    const video = document.createElement("video");
    const url = URL.createObjectURL(file);

    video.preload = "metadata";

    video.onloadedmetadata = () => {

      const info = {
        width: video.videoWidth,
        height: video.videoHeight,
        fps: 30
      };

      URL.revokeObjectURL(url);
      resolve(info);
    };

    video.onerror = reject;
    video.src = url;
  });
}

function chooseMimeType() {

  const types = [
    "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm"
  ];

  for (const type of types) {
    if (MediaRecorder.isTypeSupported(type)) {
      return type;
    }
  }

  return "";
}

function calculateSize(width, height, target) {

  if (target === "original") {
    return {
      width,
      height
    };
  }

  const maxHeight = Number(target);

  if (height <= maxHeight) {
    return {
      width,
      height
    };
  }

  const ratio = maxHeight / height;

  let newWidth = Math.round(width * ratio);

  if (newWidth % 2 !== 0) {
    newWidth--;
  }

  return {
    width: newWidth,
    height: maxHeight
  };
}

encodeButton.addEventListener("click", async () => {

  const file = videoInput.files[0];

  if (!file) {
    statusBox.textContent = "❌ Select a video first.";
    return;
  }

  if (!window.MediaRecorder) {
    statusBox.textContent =
      "❌ This browser does not support video encoding.";
    return;
  }

  encodeButton.disabled = true;
  progress.style.display = "block";
  progress.value = 0;

  try {

    statusBox.textContent = "Reading video...";

    const info = await getVideoInfo(file);

    const resolution =
      document.getElementById("resolution").value;

    const fpsSetting =
      document.getElementById("fps").value;

    const quality =
      Number(document.getElementById("quality").value);

    const size = calculateSize(
      info.width,
      info.height,
      resolution
    );

    const video = document.createElement("video");

    video.muted = true;
    video.playsInline = true;
    video.autoplay = false;

    const sourceURL = URL.createObjectURL(file);
    video.src = sourceURL;

    await video.play();

    const canvas = document.createElement("canvas");

    canvas.width = size.width;
    canvas.height = size.height;

    const ctx = canvas.getContext("2d", {
      alpha: false
    });

    const stream =
      canvas.captureStream(
        fpsSetting === "original"
          ? 30
          : Number(fpsSetting)
      );

    const audioContext =
      new (window.AudioContext ||
      window.webkitAudioContext)();

    const source =
      audioContext.createMediaElementSource(video);

    const destination =
      audioContext.createMediaStreamDestination();

    source.connect(destination);

    const audioTrack =
      destination.stream.getAudioTracks()[0];

    if (audioTrack) {
      stream.addTrack(audioTrack);
    }

    const mimeType = chooseMimeType();

    if (!mimeType) {
      throw new Error(
        "No compatible video encoder found in this browser."
      );
    }

    const chunks = [];

    const recorder = new MediaRecorder(
      stream,
      {
        mimeType: mimeType,
        videoBitsPerSecond:
          Math.round(8000000 * quality),
        audioBitsPerSecond: 192000
      }
    );

    recorder.ondataavailable = event => {

      if (event.data.size > 0) {
        chunks.push(event.data);
      }
    };

    const finished = new Promise(resolve => {

      recorder.onstop = resolve;

    });

    recorder.start(1000);

    statusBox.textContent =
      "Encoding video locally...";

    function drawFrame() {

      if (video.ended || video.paused) {

        if (recorder.state !== "inactive") {
          recorder.stop();
        }

        return;
      }

      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const percentage =
        (video.currentTime /
        video.duration) * 100;

      progress.value =
        Math.min(100, percentage);

      requestAnimationFrame(drawFrame);
    }

    drawFrame();

    await finished;

    video.pause();
    URL.revokeObjectURL(sourceURL);

    await audioContext.close();

    const blob =
      new Blob(
        chunks,
        { type: mimeType }
      );

    const extension =
      mimeType.includes("mp4")
        ? "mp4"
        : "webm";

    const outputURL =
      URL.createObjectURL(blob);

    const download =
      document.createElement("a");

    download.href = outputURL;

    download.download =
      "TikTok-Optimized." + extension;

    document.body.appendChild(download);

    download.click();

    download.remove();

    statusBox.innerHTML =
      "✅ Encoding complete!<br>" +
      "Your optimized video has been saved.";

    progress.value = 100;

    setTimeout(() => {
      URL.revokeObjectURL(outputURL);
    }, 10000);

  } catch (error) {

    console.error(error);

    statusBox.textContent =
      "❌ Encoding failed: " +
      error.message;

  } finally {

    encodeButton.disabled = false;
  }

});
</script>

</body>
</html>
