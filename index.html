<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TikTok Encoder</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b0b0f;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
}

.container{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:25px 18px;
}

h1{
  text-align:center;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#999;
  margin-bottom:25px;
}

.card{
  background:#15151c;
  border:1px solid #292934;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}

.upload{
  display:block;
  border:2px dashed #555;
  border-radius:15px;
  padding:40px 15px;
  text-align:center;
  cursor:pointer;
}

.upload:active{
  background:#202027;
}

input[type="file"]{
  display:none;
}

button{
  width:100%;
  padding:16px;
  margin-top:18px;
  border:0;
  border-radius:12px;
  background:white;
  color:black;
  font-size:16px;
  font-weight:bold;
}

button:disabled{
  opacity:.4;
}

label{
  display:block;
  margin-top:18px;
  color:#ccc;
}

select,
input[type="range"]{
  width:100%;
  margin-top:8px;
}

select{
  padding:12px;
  border-radius:10px;
  background:#22222b;
  color:white;
  border:1px solid #444;
}

.progress{
  width:100%;
  height:10px;
  margin-top:18px;
  background:#292934;
  border-radius:20px;
  overflow:hidden;
}

#bar{
  width:0%;
  height:100%;
  background:white;
  transition:width .2s;
}

#status{
  text-align:center;
  color:#aaa;
  margin-top:12px;
}

.download{
  display:none;
  margin-top:20px;
}

.download a{
  display:block;
  padding:15px;
  text-align:center;
  background:white;
  color:black;
  border-radius:12px;
  text-decoration:none;
  font-weight:bold;
}

.info{
  color:#888;
  font-size:13px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 TikTok Encoder</h1>

<div class="subtitle">
HandBrake-style TikTok video optimizer
</div>

<div class="card">

<label class="upload" for="video">

📁<br><br>

<b>Select your video</b>

<br><br>

<small>MP4 / MOV / WebM</small>

</label>

<input
  id="video"
  type="file"
  accept="video/mp4,video/quicktime,video/webm,video/*"
>

<p id="fileName" class="info">
No video selected
</p>

</div>


<div class="card">

<h3>Encoding Settings</h3>

<label>

Quality (CRF):
<span id="crfValue">18</span>

<input
  id="crf"
  type="range"
  min="16"
  max="28"
  value="18"
>

</label>


<label>

Frame Rate

<select id="fps">

<option value="original">
Original FPS
</option>

<option value="60">
60 FPS
</option>

<option value="30">
30 FPS
</option>

</select>

</label>


<label>

Resolution

<select id="resolution">

<option value="original">
Original
</option>

<option value="1080">
1080p
</option>

<option value="720">
720p
</option>

</select>

</label>


<button id="encode" disabled>
⚡ Encode & Optimize
</button>


<div class="progress">

<div id="bar"></div>

</div>


<div id="status">
Ready
</div>


<div
  class="download"
  id="downloadBox"
>

<a id="downloadLink">
⬇️ Download Optimized Video
</a>

</div>

</div>


<div class="card info">

<b>About this encoder</b>

<br><br>

The encoder prepares videos using
H.264 video, AAC audio and MP4 output.

TikTok may apply additional processing
after upload.

</div>

</div>


<!-- FFmpeg -->

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

<script>

const status =
document.getElementById("status");

const bar =
document.getElementById("bar");

const videoInput =
document.getElementById("video");

const encodeButton =
document.getElementById("encode");

const fileName =
document.getElementById("fileName");

const crf =
document.getElementById("crf");

const crfValue =
document.getElementById("crfValue");

const fps =
document.getElementById("fps");

const resolution =
document.getElementById("resolution");

const downloadBox =
document.getElementById("downloadBox");

const downloadLink =
document.getElementById("downloadLink");


let selectedFile = null;


/* CRF */

crf.addEventListener(
"input",
function(){

crfValue.textContent =
crf.value;

});


/* FILE */

videoInput.addEventListener(
"change",
function(){

selectedFile =
videoInput.files[0];

if(!selectedFile){

encodeButton.disabled =
true;

return;

}

fileName.textContent =
selectedFile.name +
" • " +
(
selectedFile.size /
1024 /
1024
).toFixed(2) +
" MB";

encodeButton.disabled =
false;

status.textContent =
"Video ready";

});


/* FFmpeg */

let ffmpeg = null;


async function loadEncoder(){

if(ffmpeg){

return true;

}

status.textContent =
"Loading encoder...";


try{

if(
typeof FFmpeg ===
"undefined"
){

throw new Error(
"FFmpeg library failed to load"
);

}


const createFFmpeg =
FFmpeg.createFFmpeg;

const fetchFile =
FFmpeg.fetchFile;


ffmpeg =
createFFmpeg({

log:true,

corePath:
"https://unpkg.com/@ffmpeg/core@0.11.6/dist/ffmpeg-core.js"

});


await ffmpeg.load();


status.textContent =
"Encoder ready";

return true;

}catch(error){

console.error(error);

ffmpeg = null;

status.textContent =
"❌ Encoder could not load. Please refresh and try again.";

return false;

}

}


/* ENCODE */

encodeButton.addEventListener(
"click",
async function(){

if(!selectedFile){

return;

}

encodeButton.disabled =
true;

downloadBox.style.display =
"none";

bar.style.width =
"0%";


const ready =
await loadEncoder();


if(!ready){

encodeButton.disabled =
false;

return;

}


try{

status.textContent =
"Preparing video...";


const extension =
selectedFile.name
.split(".")
.pop()
.toLowerCase();


const inputName =
"input." + extension;


ffmpeg.FS(
"writeFile",
inputName,
await FFmpeg.fetchFile(
selectedFile
)
);


ffmpeg.setProgress(
function(data){

let percent =
Math.round(
data.ratio * 100
);

if(percent < 0){
percent = 0;
}

if(percent > 100){
percent = 100;
}

bar.style.width =
percent + "%";

status.textContent =
"Encoding... " +
percent +
"%";

});


const outputName =
"tiktok-optimized.mp4";


let command = [

"-i",
inputName,

"-c:v",
"libx264",

"-preset",
"medium",

"-crf",
crf.value,

"-pix_fmt",
"yuv420p",

"-c:a",
"aac",

"-b:a",
"192k",

"-movflags",
"+faststart"

];


if(
fps.value !==
"original"
){

command.push(
"-r",
fps.value
);

}


if(
resolution.value !==
"original"
){

command.push(

"-vf",

"scale=-2:" +
resolution.value

);

}


command.push(
outputName
);


await ffmpeg.run(
...command
);


status.textContent =
"Creating download...";


const data =
ffmpeg.FS(
"readFile",
outputName
);


const blob =
new Blob(
[data.buffer],
{
type:
"video/mp4"
}
);


const url =
URL.createObjectURL(
blob
);


downloadLink.href =
url;

downloadLink.download =
"tiktok-optimized.mp4";


downloadBox.style.display =
"block";

bar.style.width =
"100%";

status.textContent =
"✅ Encoding complete!";


}catch(error){

console.error(error);

status.textContent =
"❌ Encoding failed.";

}


encodeButton.disabled =
false;

});

</script>

</body>
</html>
